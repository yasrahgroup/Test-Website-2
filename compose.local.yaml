# Local-only Docker setup for testing BEFORE a real domain is available.
# Visit http://localhost:8080 (or set LOCAL_PORT) and /admin.
# This binds only to your own computer, NOT the public internet.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      PUBLIC_URL: http://localhost:${LOCAL_PORT:-8080}
      STORAGE_DIR: /app/storage
      DB_PATH: /app/storage/website.sqlite
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:3000"
    volumes:
      - local_site_data:/app/storage
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      start_period: 15s
      retries: 3
volumes:
  local_site_data:
